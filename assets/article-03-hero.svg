<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <defs>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#c9a46a"/><stop offset="1" stop-color="#c9a46a" stop-opacity=".55"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23363f" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#1b2a33"/>
  <rect x="80" y="80" width="680" height="420" fill="url(#grid)"/>
  <!-- axes -->
  <path d="M80 80V500H760" fill="none" stroke="#5b6f79" stroke-width="2"/>
  <!-- closure threshold -->
  <path d="M80 452H760" stroke="#8fa0a8" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- concentration curve -->
  <path d="M130 130 C 250 130, 290 400, 420 438 C 480 446, 550 448, 600 448" fill="none" stroke="url(#fade)" stroke-width="7" stroke-linecap="round"/>
  <path d="M600 448 C 660 449, 700 450, 760 451" fill="none" stroke="#c9a46a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14" opacity=".8"/>
  <circle cx="130" cy="130" r="11" fill="#1b2a33" stroke="#c9a46a" stroke-width="5"/>
  <circle cx="600" cy="448" r="11" fill="#c9a46a"/>
  <text x="152" y="122" fill="#eef1f2" font-family="IBM Plex Sans, Noto Sans CJK TC, sans-serif" font-size="30" font-weight="700">15.95 ppm</text>
  <text x="600" y="416" fill="#eef1f2" font-family="IBM Plex Sans, Noto Sans CJK TC, sans-serif" font-size="30" font-weight="700" text-anchor="middle">&lt; 0.888 ppm</text>
  <!-- ruler -->
  <g transform="translate(800 70)">
    <rect width="46" height="470" rx="4" fill="#c9a46a"/>
    <g stroke="#1b2a33" stroke-width="3">
      <path d="M0 20h22M0 40h12M0 60h12M0 80h12M0 100h22M0 120h12M0 140h12M0 160h12M0 180h22M0 200h12M0 220h12M0 240h12M0 260h22M0 280h12M0 300h12M0 320h12M0 340h22M0 360h12M0 380h12M0 400h12M0 420h22M0 440h12"/>
    </g>
  </g>
  <!-- three states: done / tracking / not yet proven -->
  <g transform="translate(900 120)" font-family="IBM Plex Sans, sans-serif">
    <g>
      <circle cx="26" cy="26" r="24" fill="#c9a46a"/>
      <path d="M14 27l8 8 16-17" fill="none" stroke="#1b2a33" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="70" y="12" width="170" height="12" rx="6" fill="#eef1f2"/>
      <rect x="70" y="34" width="110" height="10" rx="5" fill="#8fa0a8"/>
    </g>
    <g transform="translate(0 130)">
      <circle cx="26" cy="26" r="22" fill="none" stroke="#c9a46a" stroke-width="5"/>
      <path d="M26 4a22 22 0 0 1 0 44z" fill="#c9a46a"/>
      <rect x="70" y="12" width="150" height="12" rx="6" fill="#eef1f2" opacity=".8"/>
      <rect x="70" y="34" width="130" height="10" rx="5" fill="#8fa0a8" opacity=".8"/>
    </g>
    <g transform="translate(0 260)">
      <circle cx="26" cy="26" r="22" fill="none" stroke="#8fa0a8" stroke-width="4" stroke-dasharray="6 6"/>
      <rect x="70" y="12" width="160" height="12" rx="6" fill="#eef1f2" opacity=".35"/>
      <rect x="70" y="34" width="90" height="10" rx="5" fill="#8fa0a8" opacity=".35"/>
    </g>
  </g>
  <!-- waves -->
  <path d="M80 575 q30 -16 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#3e5a6a" stroke-width="4" stroke-linecap="round"/>
</svg>
